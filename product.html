<!DOCTYPE html>
<html>
<head>
    <title>Product - Piggy Bank</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(
                135deg,
                #FFE5EC,
                #FFF0F5,
                #FFD6E7
            );
            color: #C95D8A;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        ul li {
            display: inline;
            margin: 15px;
        }

        a {
            text-decoration: none;
            color: #FF6F91;
            font-weight: bold;
        }

        h1 {
            color: #FF6F91;
        }

        .card {
            background: #FFF8FB;
            width: 80%;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 6px 15px rgba(255, 182, 193, 0.3);
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 8px;
            border: 2px solid #FFC2D1;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 12px;
            background: #FF8FAB;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #FF6F91;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: #FFD6E7;
            border-radius: 20px;
            overflow: hidden;
        }

        #progressFill {
            width: 0%;
            height: 100%;
            background: #FF8FAB;
        }

        .pig {
            font-size: 80px;
        }
    </style>

</head>

<body>

    <h1>Product</h1>

    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="design.html">Design Process</a></li>
        <li>Product</li>
    </ul>

    <div class="pig">🐷</div>

    <h1>Piggy Bank</h1>

    <p>Save today, smile tomorrow 💕</p>

    <https://colab.research.google.com/drive/132EFFeYJw2yxgegNaWyRlG_63XYEdZ4x?usp=sharing-->
    <p>
        <a href="https://colab.research.google.com/drive/132EFFeYJw2yxgegNaWyRlG_63XYEdZ4x?usp=sharing" target="_blank">
            <button>
                🐍 Lihat Source Code Python
            </button>
        </a>
    </p>

    <div class="card">
        <h2>🎯 Target Tabungan</h2>

        <input
            type="number"
            id="targetInput"
            placeholder="Masukkan target tabungan">

        <br>

        <button onclick="setTarget()">
            Simpan Target
        </button>

        <p>
            Target:
            Rp <span id="target">0</span>
        </p>
    </div>

    <div class="card">
        <h2>💰 Total Tabungan</h2>

        <p>
            Rp <span id="total">0</span>
        </p>

        <input
            type="number"
            id="inputTabungan"
            placeholder="Masukkan tabungan">

        <br>

        <button onclick="tambahTabungan()">
            Tambah Tabungan
        </button>
    </div>

    <div class="card">
        <h2>🌸 Progress Target</h2>

        <div class="progress-bar">
            <div id="progressFill"></div>
        </div>

        <p id="progressText">0%</p>
    </div>

    <div class="card">
        <h2>📖 Riwayat Tabungan</h2>
        <ul id="riwayat"></ul>
    </div>

<script>

let total = 0;
let target = 0;

function setTarget() {

    target = parseInt(
        document.getElementById("targetInput").value
    );

    if (!target || target <= 0) {
        alert("Masukkan target yang benar!");
        return;
    }

    document.getElementById("target").innerText =
        target.toLocaleString("id-ID");

    updateProgress();
}

function tambahTabungan() {

    let jumlah = parseInt(
        document.getElementById("inputTabungan").value
    );

    if (!jumlah || jumlah <= 0) {
        alert("Masukkan jumlah yang benar!");
        return;
    }

    total += jumlah;

    document.getElementById("total").innerText =
        total.toLocaleString("id-ID");

    let tanggal =
        new Date().toLocaleDateString("id-ID");

    let li = document.createElement("li");

    li.innerHTML =
        tanggal +
        " : +Rp" +
        jumlah.toLocaleString("id-ID");

    document.getElementById("riwayat")
        .prepend(li);

    document.getElementById("inputTabungan").value = "";

    updateProgress();
}

function updateProgress() {

    let progress = 0;

    if (target > 0) {

        progress =
        (total / target) * 100;

        if (progress > 100) {
            progress = 100;
        }
    }

    document.getElementById("progressFill")
        .style.width = progress + "%";

    document.getElementById("progressText")
        .innerText =
        Math.floor(progress) +
        "% tercapai";
}

</script>

</body>
</html>
