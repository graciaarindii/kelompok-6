    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #ffeef5);
            color: #d95d8a;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        ul li {
            display: inline;
            margin: 15px;
        }

        a {
            text-decoration: none;
            color: #ff6fa1;
            font-weight: bold;
        }

        h1 {
            color: #ff6fa1;
        }

        .card {
            background: rgba(255,255,255,0.8);
            width: 80%;
            max-width: 500px;
            margin: 20px auto;
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255,182,193,0.4);
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 8px;
            border: 2px solid #ffc2d1;
            border-radius: 10px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 10px;
            background: #ff8fb1;
            color: white;
            cursor: pointer;
        }

        .progress-bar {
            width: 100%;
            height: 25px;
            background: #ffd6e7;
            border-radius: 20px;
            overflow: hidden;
        }

        #progressFill {
            width: 0%;
            height: 100%;
            background: #ff8fb1;
        }

        .pig {
            font-size: 80px;
        }
    </style>

</head>
